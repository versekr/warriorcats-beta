<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Пещерка трав warriorbeta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Podkova:wght@400;600;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="herbcave">
<div class="left-panel">
<div class="player-info">
<span id="cat-display"></span>
<button class="menu-btn" onclick="goTo('profile.html')">Профиль</button>

<button class="menu-btn" onclick="openInventory()">Инвентарь</button>
<button class="menu-btn" onclick="openPlayers()">Игроки</button>
<button class="menu-btn" onclick="openCondition()">Состояние</button>
</div>
</div>
<div class="location-info">пещерка трав-08</div>

<!-- Кот и другие игроки -->
<div class="cats-field">
<div id="cat-container">
<img id="cat" src="images/cat-tabby.png">
<div id="cat-name"></div>
</div>
<div id="other-players"></div>
</div>

<div id="items-on-ground"></div>



<!-- Правая панель -->
<div class="panel-container">
<div class="controls-row">
<select name="going1" size="1">
<option value="1008">целительская</option>
</select>
<input class="okk" type="submit" value="→" onclick="moving(parseInt(document.querySelector('select[name=going1]').value, 10), 'move'); return false;">
<button class="toggle-actions" onclick="toggleActions()">☰</button>
</div>
<div id="actions-panel" class="actions-panel">
<button onclick="hunt()">Охотиться</button>
<button onclick="explore()">Осмотреться</button>
<button onclick="rest()">Отдохнуть</button>
</div>
<div id="log" class="log"></div>
<div class="chat-container">
<div id="chat-messages" class="chat-messages"></div>
<div class="chat-input">
<input type="text" id="chat-input" placeholder="Написать в чат..." maxlength="150" enterkeyhint="send">
<button onclick="sendChatMessage()">Отправить</button>
</div>
</div>
</div>

<div id="inventory-modal" class="inventory-modal">
<div class="inventory-box">
<h2>Инвентарь</h2>
<div id="inventory-items" class="inventory-items"></div>
<button onclick="dropAllItems()" style="background:linear-gradient(135deg,#c0392b,#8b1a0e);">Выложить всё</button>
<button onclick="closeInventory()">Закрыть</button>
</div>
</div>

<div id="players-modal" class="players-modal">
<div class="players-box">
<h2>Игроки</h2>
<div id="online-count"></div>
<div id="online-players" class="players-list"></div>
<button onclick="closePlayers()">Закрыть</button>
</div>
</div>

<div id="condition-modal" class="condition-modal">
<div class="condition-box">
<h2>Состояние</h2>
<div id="condition-content" class="condition-content"></div>
<button onclick="closeCondition()">Закрыть</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="script.js"></script>
<script src="auth.js"></script>
</body>
</html>
