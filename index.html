<!DOCTYPE html>
<html lang="ru">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Podkova:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Sans+Caption:wght@400;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<title>Коты Воители</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Коты Воители</h1>
<h2>Бета версия</h2>
<div id="start-screen">
<button onclick="createCharacter()">Создать нового кота</button>
<button onclick="loadGame()">Продолжить игру</button>
</div>
<div id="character-creation" style="display: none;">
<h2>Создание персонажа</h2>
<label>Имя кота:</label><br>
<input type="text" id="catName"><br><br>
<label>Пол:</label><br>
<select id="catGender">
<option value="tom">Кот</option>
<option value="she-cat">Кошка</option>
</select><br><br>
<label>Окрас:</label><br>
<select id="catColor">
<option value="рыжий">Рыжий</option>
<option value="серый">Серый</option>
<option value="чёрный">Чёрный</option>
<option value="белый">Белый</option>
<option value="черепаховый">Черепаховый</option>
<option value="полосатый">Полосатый</option>
</select><br><br>
<label>Роль:</label><br>
<select id="catRole">
<option value="котёнок">Котёнок</option>
<option value="ученик">Ученик</option>
<option value="воин">Воин</option>
<option value="ученик">Ученик</option>
<option value="целитель">Целитель</option>
<option value="старейшина">Старейшина</option>
<option value="глашатай">Глашатай</option>
<option value="предводитель">предводитель</option>
</select><br><br>
<button onclick="saveCharacter()">Создать кота и начать игру!</button>
</div>
<div class="contact-block">
<h2>Связь с разработчиком</h2>
<p>Нашли баг? Есть идея? Пишите!</p>
<div class="contact-links">
<a href="https://t.me/damnr_444" target="_blank" class="contact-btn">Telegram</a>
<a href="https://t.me/damnr_444?text=Привет, нашёл баг в игре: " target="_blank" class="contact-btn">Сообщить о баге</a>
</div>
</div>
<div class="version-info">
<p>Warrior Cats Beta v0.1</p>
<p>Последнее обновление: сентябрь 2026</p>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
